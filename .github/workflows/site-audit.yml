name: Static SEO Audit

on:
  pull_request:
  push:
    branches:
      - main

permissions:
  contents: read

jobs:
  static-seo-audit:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: Check JavaScript syntax
        run: |
          node --check api/contact.js
          node --check scripts/audit-site.js
      - name: Run sitemap-wide SEO audit
        run: npm run audit:site
