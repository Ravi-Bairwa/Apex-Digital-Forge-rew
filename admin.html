<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Admin</title>
<meta name="robots" content="noindex, nofollow, noarchive">
<link rel="stylesheet" href="/css/style.css?v=10">
<style>
  body { display:flex; align-items:center; justify-content:center; min-height:100vh; padding:24px; }
  .admin-card { max-width:640px; width:100%; background:var(--dark2); border:1px solid var(--border); border-radius:var(--radius-lg); padding:36px; }
  .admin-card h1 { font-family:var(--font-heading); font-size:22px; margin-bottom:8px; }
  .admin-card p.sub { color:var(--muted2); font-size:14px; margin-bottom:24px; }
  .admin-field { margin-bottom:16px; }
  .admin-field label { display:block; font-size:12px; font-weight:600; text-transform:uppercase; letter-spacing:.04em; color:var(--muted2); margin-bottom:6px; }
  .admin-field input, .admin-field select, .admin-field textarea {
    width:100%; background:var(--dark3); border:1px solid var(--border2); border-radius:8px;
    padding:12px 14px; font-size:14px; color:var(--white); font-family:inherit;
  }
  .admin-field textarea { resize:vertical; line-height:1.6; }
  .admin-btn { width:100%; background:var(--accent); color:#fff; border:none; padding:14px; border-radius:var(--radius);
    font-family:var(--font-heading); font-size:15px; font-weight:700; cursor:pointer; margin-top:8px; }
  .admin-btn:disabled { opacity:.6; cursor:not-allowed; }
  .admin-status { margin-top:16px; font-size:14px; padding:12px 14px; border-radius:8px; display:none; }
  .admin-status.show { display:block; }
  .admin-status.ok { background:rgba(34,197,94,0.1); color:#22c55e; }
  .admin-status.err { background:rgba(239,68,68,0.1); color:#ef4444; }
  .admin-status a { color:inherit; text-decoration:underline; }
  #genView { display:none; }
</style>
</head>
<body>

<div class="admin-card" id="gateView">
  <h1>Admin</h1>
  <p class="sub">Enter your admin password to continue.</p>
  <div class="admin-field">
    <label>Password</label>
    <input type="password" id="adminPassword" placeholder="••••••••">
  </div>
  <button class="admin-btn" id="unlockBtn" onclick="unlock()">Unlock</button>
  <div class="admin-status err" id="gateStatus"></div>
</div>

<div class="admin-card" id="genView">
  <h1>Publish an article</h1>
  <p class="sub">Write or generate the article text yourself (e.g. ask Claude in a normal chat), then paste it here. This creates a real permanent page, adds it to the blog grid, and updates the sitemap - live in about 30-60 seconds.</p>
  <div class="admin-field">
    <label>Title</label>
    <input type="text" id="genTitle" placeholder="e.g. How to Build DA 60+ Backlinks for E-commerce Sites">
  </div>
  <div class="admin-field">
    <label>Category</label>
    <select id="genCategory">
      <option value="Link Building">Link Building</option>
      <option value="SEO Strategy">SEO Strategy</option>
      <option value="Agency Growth">Agency Growth</option>
      <option value="AI & Automation">AI &amp; Automation</option>
      <option value="Case Study">Case Study</option>
    </select>
  </div>
  <div class="admin-field">
    <label>Meta description (optional - auto-generated from content if left blank)</label>
    <input type="text" id="genMeta" placeholder="Short summary for search engines, ~150 characters">
  </div>
  <div class="admin-field">
    <label>Content (paste your article - use ## for a heading, ### for a sub-heading, **text** for bold, "- " for a bullet list, blank lines between paragraphs)</label>
    <textarea id="genContent" rows="14" placeholder="## Introduction

Paste your article here...

## Next Section

More content..."></textarea>
  </div>
  <button class="admin-btn" id="genBtn" onclick="generateAndPublish()">Publish Article</button>
  <div class="admin-status" id="genStatus"></div>
</div>

<script>
  var ADMIN_KEY_STORAGE = 'adf-admin-key';

  function unlock() {
    var pw = document.getElementById('adminPassword').value;
    var status = document.getElementById('gateStatus');
    if (!pw) { status.textContent = 'Enter a password.'; status.classList.add('show'); return; }
    // Store for this session only; the real check happens server-side on every request.
    sessionStorage.setItem(ADMIN_KEY_STORAGE, pw);
    document.getElementById('gateView').style.display = 'none';
    document.getElementById('genView').style.display = 'block';
  }

  async function generateAndPublish() {
    var titleEl = document.getElementById('genTitle');
    var categoryEl = document.getElementById('genCategory');
    var metaEl = document.getElementById('genMeta');
    var contentEl = document.getElementById('genContent');
    var btn = document.getElementById('genBtn');
    var status = document.getElementById('genStatus');
    var title = titleEl.value.trim();
    var content = contentEl.value.trim();
    if (!title) { titleEl.focus(); return; }
    if (!content) { contentEl.focus(); return; }

    var adminKey = sessionStorage.getItem(ADMIN_KEY_STORAGE) || '';
    btn.disabled = true;
    btn.textContent = 'Publishing...';
    status.className = 'admin-status show';
    status.textContent = 'Publishing your article - this takes a few seconds.';

    try {
      var res = await fetch('/api/generate-article', {
        method: 'POST',
        headers: { 'Content-Type': 'application/json', 'x-admin-key': adminKey },
        body: JSON.stringify({ title: title, category: categoryEl.value, content: content, metaDescription: metaEl.value.trim() })
      });
      var data = await res.json();
      if (res.ok && data.success) {
        status.className = 'admin-status show ok';
        status.innerHTML = 'Published! <a href="' + data.url + '" target="_blank">' + data.url + '</a> - ' + data.message;
        titleEl.value = '';
        metaEl.value = '';
        contentEl.value = '';
      } else if (res.status === 401) {
        status.className = 'admin-status show err';
        status.textContent = 'Wrong password. Refresh this page and try again.';
        sessionStorage.removeItem(ADMIN_KEY_STORAGE);
      } else {
        status.className = 'admin-status show err';
        status.textContent = 'Failed: ' + (data.error || 'Unknown error.');
      }
    } catch (err) {
      status.className = 'admin-status show err';
      status.textContent = 'Connection error. Please try again.';
    }
    btn.disabled = false;
    btn.textContent = 'Publish Article';
  }

  // Enter key shortcuts
  document.getElementById('adminPassword').addEventListener('keypress', function(e) {
    if (e.key === 'Enter') unlock();
  });
</script>

</body>
</html>
